name: Local Repository Lifecycle Acceptance
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwsh-syntax:
    name: PowerShell syntax validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all feature PowerShell scripts
        shell: pwsh
        run: |
          $featurePath = 'integration/feature/local-repository-lifecycle'
          $checker = Join-Path $featurePath 'check-local-repository-lifecycle-syntax.ps1'
          $scripts = Get-ChildItem -LiteralPath $featurePath -Filter '*.ps1' -File
          if (-not $scripts) { throw "No PowerShell scripts found in $featurePath" }
          foreach ($script in $scripts) {
            Write-Host "Checking $($script.FullName)"
            & $checker -ScriptPath $script.FullName
          }
          Write-Host "PASS: syntax validated for $($scripts.Count) PowerShell scripts."
  local-repo-characterization:
    needs: pwsh-syntax
    name: Local repo characterization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Characterize current raw-launcher behavior
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/characterize-local-repository-lifecycle.ps1
        shell: pwsh

  local-repo-lock:
    needs: pwsh-syntax
    name: Local repo lock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Install lsof on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
        shell: bash
      - name: Check repository locks and clean deletion
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/acceptance-local-repository-lock.ps1
        shell: pwsh

  local-repo-rebuild:
    needs: pwsh-syntax
    name: Local repo rebuild (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Check repository creation and rebuild
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/acceptance-local-repository-rebuild.ps1
        shell: pwsh

  local-repo-raw-launcher:
    needs: pwsh-syntax
    name: Local repo raw launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Install lsof on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
        shell: bash
      - name: Check raw launcher lifecycle
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/acceptance-local-repository-raw-launcher.ps1
        shell: pwsh

  local-repo-concurrency:
    needs: pwsh-syntax
    name: Local repo concurrency (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Check concurrent repository consumer isolation
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/acceptance-local-repository-concurrency.ps1
        shell: pwsh

  local-repo-resolution-characterization:
    needs: pwsh-syntax
    name: Local repo resolution characterization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Characterize repository resolution and repeated publication
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/characterize-local-repository-resolution.ps1
        shell: pwsh
