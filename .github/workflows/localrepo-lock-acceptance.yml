name: Local Repository Lifecycle Acceptance
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwsh-syntax:
    name: PowerShell syntax validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all feature PowerShell scripts
        shell: pwsh
        run: |
          $featurePath = 'integration/feature/local-repository-lifecycle'
          $checker = Join-Path $featurePath 'check-syntax.ps1'
          $scripts = Get-ChildItem -LiteralPath $featurePath -Filter '*.ps1' -File
          if (-not $scripts) { throw "No PowerShell scripts found in $featurePath" }
          foreach ($script in $scripts) {
            Write-Host "Checking $($script.FullName)"
            & $checker -ScriptPath $script.FullName
          }
          Write-Host "PASS: syntax validated for $($scripts.Count) PowerShell scripts."
  local-repo-characterization:
    needs: pwsh-syntax
    name: Local repo characterization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Characterize current raw-launcher behavior
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/characterize-lifecycle.ps1
        shell: pwsh

  local-repo-lock:
    needs: pwsh-syntax
    name: Local repo lock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Check repository locks and clean deletion
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/acceptance-lock.ps1
        shell: pwsh

  local-repo-rebuild:
    needs: pwsh-syntax
    name: Local repo rebuild (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Check repository creation and rebuild
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/acceptance-rebuild.ps1
        shell: pwsh

  local-repo-raw-launcher:
    needs: pwsh-syntax
    name: Local repo raw launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Check raw launcher lifecycle
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/acceptance-raw-launcher.ps1
        shell: pwsh

  local-repo-concurrency:
    needs: pwsh-syntax
    name: Local repo concurrency (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Check concurrent repository consumer isolation
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/acceptance-concurrency.ps1
        shell: pwsh

  local-repo-resolution-characterization:
    needs: pwsh-syntax
    name: Local repo resolution characterization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Characterize repository resolution and repeated publication
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/characterize-resolution.ps1
        shell: pwsh
  local-repo-linux-docker:
    needs: pwsh-syntax
    name: Local repo Linux scenarios (Docker / ubuntu:latest)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and run isolated Linux scenarios in Docker
        run: |
          docker build --pull --file integration/feature/local-repository-lifecycle/Containerfile --tag mill-local-repository-lifecycle:ci .
          docker volume create mill-local-repository-lifecycle-coursier >/dev/null
          scenarios=(
            characterization
            lock
            rebuild
            raw-launcher
            concurrency
            resolution-characterization
          )
          failed=0
          for scenario in "${scenarios[@]}"; do
            echo
            echo "########## Linux scenario: $scenario ##########"
            if docker run --rm --init \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
              --mount "type=volume,source=mill-local-repository-lifecycle-coursier,target=/root/.cache/coursier" \
              mill-local-repository-lifecycle:ci "$scenario"; then
              echo "PASS: Linux scenario '$scenario'."
            else
              echo "FAIL: Linux scenario '$scenario'." >&2
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more Linux local-repository-lifecycle scenarios failed." >&2
            exit 1
          fi
          echo "PASS: all six Linux local-repository-lifecycle scenarios."
        shell: bash

  local-repo-linux-direct:
    needs: pwsh-syntax
    name: Local repo Linux scenarios (direct / ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Install Linux acceptance-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof
        shell: bash
      - name: Run all Linux scenarios directly on the host
        run: pwsh -NoLogo -NoProfile -File integration/feature/local-repository-lifecycle/acceptance-tests.ps1
        shell: bash
