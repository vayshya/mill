name: Local Repository Lifecycle Regression
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwsh-syntax:
    name: PowerShell parser validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every lifecycle PowerShell script
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath 'integration/feature/local-repository-lifecycle' -Filter '*.ps1' -File -Recurse)
          if ($files.Count -eq 0) { throw 'No PowerShell scripts found.' }
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $parseErrors) {
                Write-Error ("{0}:{1}:{2}: {3}" -f $file.FullName, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
              }
            } else {
              Write-Host ("PASS: {0}" -f $file.FullName)
            }
          }
          if ($failed) { throw 'PowerShell parser reported syntax errors.' }
  local-repo-characterization:
    needs: pwsh-syntax
    name: Local repo characterization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Characterize current raw-launcher behavior
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/characterize-local-repository-lifecycle.ps1
        shell: pwsh

  local-repo-lock:
    needs: pwsh-syntax
    name: Local repo lock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Install lsof on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
        shell: bash
      - name: Check repository locks and clean deletion
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/test-local-repository-lock.ps1
        shell: pwsh

  local-repo-rebuild:
    needs: pwsh-syntax
    name: Local repo rebuild (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Check repository creation and rebuild
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/test-local-repository-rebuild.ps1
        shell: pwsh

  local-repo-raw-launcher:
    needs: pwsh-syntax
    name: Local repo raw launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Install lsof on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
        shell: bash
      - name: Check raw launcher lifecycle
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/test-local-repository-raw-launcher.ps1
        shell: pwsh

  local-repo-concurrency:
    needs: pwsh-syntax
    name: Local repo concurrency (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Check concurrent repository consumer isolation
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/test-local-repository-concurrency.ps1
        shell: pwsh
