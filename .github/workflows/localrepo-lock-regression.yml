name: Local Repo File Lock Regression

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-repo-lock:
    name: Local repo lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: 'coursier'

      - name: Build raw platform launcher (Unix)
        if: runner.os != 'Windows'
        run: ./mill dist.raw.executable
        shell: bash

      - name: Build raw platform launcher (Windows)
        if: runner.os == 'Windows'
        run: ./mill.bat dist.raw.executable
        shell: pwsh

      - name: Test local repository evaluation and cleanup
        run: pwsh -NoProfile -File scripts/test-windows-localrepo-lock.ps1
        shell: pwsh
