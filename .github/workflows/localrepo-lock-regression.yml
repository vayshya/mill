name: Local Repo File Lock Regression
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-repo-lock:
    name: Local repo lock (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Reproduce raw launcher local repository lock
        run: pwsh -NoProfile -File scripts/test-windows-localrepo-lock.ps1
        shell: pwsh
