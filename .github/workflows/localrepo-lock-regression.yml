name: Local Repo Open Handle Regression
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-repo-characterization:
    name: Local repo characterization (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Characterize current raw-launcher behavior
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/characterize-local-repository-lifecycle.ps1
        shell: pwsh

  local-repo-open-handles:
    name: Local repo open handles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Install lsof on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
        shell: bash
      - name: Check all launcher and lifecycle variants
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/test-local-repository-lock.ps1
        shell: pwsh


  local-repo-concurrency:
    name: Local repo concurrency (${{'${{ matrix.os }}'}})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{'${{ matrix.os }}'}}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Check concurrent repository consumer isolation
        run: pwsh -NoProfile -File integration/feature/local-repository-lifecycle/test-local-repository-concurrency.ps1
        shell: pwsh
